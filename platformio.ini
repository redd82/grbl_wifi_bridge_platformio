; GRBL WiFi bridge for ESP32-S3 (ESP-IDF framework under PlatformIO)
; Board: ESP32-S3 dev board, module ESP32-S3-N8R2 (8 MB flash, 2 MB PSRAM)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

board_upload.flash_size = 8MB
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Flash and monitor through the UART port (not the native USB port).
; Uncomment and set if PlatformIO picks the wrong port:
; upload_port = COM5
; monitor_port = COM5
